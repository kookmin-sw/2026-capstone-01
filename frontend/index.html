<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Krip</title>
  </head>
  <body>
    <div
      id="app-loader"
      aria-hidden="true"
      style="
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #01C0C0;
        transition: opacity 220ms ease;
      "
    >
      <img
        id="app-loader-image"
        alt="Krip loading"
        src="/krip_logo.png"
        style="width: 25vw; height: auto; display: block;"
      />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
