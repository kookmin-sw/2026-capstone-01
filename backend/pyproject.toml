[project]
name = "backend"
version = "0.1.0"
description = "Krip Backend"
readme = "README.md"
requires-python = "==3.10.20"
dependencies = [
    # backend
    "aiofiles==24.1.0",
    "aiosmtplib==5.0.0",
    "alembic==1.16.4",
    "apscheduler==3.11.0",
    "asyncpg==0.30.0",
    "beanie==1.26.0",
    "dependency-injector==4.48.2",
    "fastapi[standard]==0.118.0",
    "httpx==0.27.2",
    "loguru==0.7.3",
    "motor==3.3.2",
    "passlib[argon2]==1.7.4",
    "psycopg2-binary==2.9.10",
    "pydantic-settings==2.10.1",
    "pyjwt[crypto]==2.10.1",
    "pymongo==4.6.3",
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "python-socketio==5.13.0",
    "pytz==2024.1",
    "redis==6.4.0",
    "openpyxl==3.1.5",
    "pytest-cov==6.1.1",
    "boto3==1.35.0",
    "pillow==12.1.1",
    "firebase-admin>=6.5.0",
    # Monitoring
    "prometheus-client>=0.21.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    # LLM
    "langchain==1.0.0",
    "langchain-chroma==1.0.0",
    "langchain-community==0.4.1",
    "langchain-google-genai>=3.2.0",
    # AI
    "torch==2.10.0",
    "torch-geometric==2.7.0",
    "ortools>=9.15.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.8.0",
    "transformers==5.5.4",
    # Test
    "greenlet>=3.3.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test/unit", "test/integration"]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "slow: marks tests as slow running",
]
